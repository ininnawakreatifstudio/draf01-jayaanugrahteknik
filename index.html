<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff6a00">
<title>CV Jaya Anugrah Tehnik — Sistem Manajemen</title>
<style>
:root{--ink:#0f1f45;--ink2:#4a5878;--ink3:#8b95ab;--brand:#ff6a00;--brand2:#ffab00;
--teal:#00b8a9;--success:#0a8f4a;--danger:#e53935;--bg:#f5f7fb;--line:#e4e8f0;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);
color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
.hidden{display:none!important}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;
padding:24px;background:linear-gradient(135deg,#0f1f45,#1e3268)}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;
box-shadow:0 24px 60px rgba(0,0,0,.3);text-align:center}
.login-logo{max-height:80px;max-width:120px;margin:0 auto 16px}
.login-card h1{font-size:20px;font-weight:800;margin-bottom:4px}
.login-sub{color:var(--ink2);font-size:13px;margin-bottom:24px}
.login-card form{text-align:left}
.login-card label{display:block;font-size:12.5px;font-weight:700;margin-bottom:6px}
.login-card input{width:100%;padding:12px 14px;border:1.5px solid var(--line);
border-radius:10px;background:#f9fafc;outline:none;font-size:14px;margin-bottom:14px;transition:.15s}
.login-card input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 4px rgba(255,106,0,.1)}
.login-card button{width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:14px;
background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
box-shadow:0 8px 24px rgba(255,106,0,.3)}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;text-align:center;min-height:18px}

/* APP */
.app{min-height:100vh;display:flex;flex-direction:column}
.topbar{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;
display:flex;align-items:center;justify-content:space-between;gap:12px;
position:sticky;top:0;z-index:40}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{max-height:40px;max-width:48px;flex-shrink:0}
.brand-text{min-width:0;line-height:1.2}
.brand-text b{font-size:13px;font-weight:800;display:block;overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}
.brand-text small{font-size:10.5px;color:var(--ink2);text-transform:uppercase;
letter-spacing:.4px;font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);
background:#f9fafc;display:grid;place-items:center;font-size:18px;transition:.15s}
.icon-btn:hover{background:#fff;border-color:var(--brand)}
.content{flex:1;padding:20px;max-width:1100px;width:100%;margin:0 auto}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;
padding:60px 20px;gap:16px;color:var(--ink2)}
.spinner{width:36px;height:36px;border:3px solid #e4e8f0;border-top-color:var(--brand);
border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
padding:14px 16px;position:relative;overflow:hidden;box-shadow:0 1px 3px rgba(15,31,69,.06)}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
background:linear-gradient(90deg,var(--brand),var(--brand2))}
.stat.teal::before{background:linear-gradient(90deg,var(--teal),#00d4c2)}
.stat.warn::before{background:linear-gradient(90deg,#e6a000,#ffc44d)}
.stat.danger::before{background:linear-gradient(90deg,#e53935,#ff6b68)}
.stat-label{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;
letter-spacing:.5px;margin-bottom:6px}
.stat-value{font-size:20px;font-weight:800;line-height:1.2;margin-bottom:2px}
.stat-sub{font-size:11.5px;color:var(--ink2)}

/* SECTION */
.section-head{display:flex;align-items:center;justify-content:space-between;
gap:12px;margin-bottom:14px;flex-wrap:wrap}
.section-head h2{font-size:16px;font-weight:800}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;
white-space:nowrap;transition:.15s;border:1.5px solid transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));
color:#fff;box-shadow:0 4px 12px rgba(255,106,0,.25)}
.btn-ghost{background:#fff;border-color:var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-success{background:linear-gradient(135deg,#0a8f4a,#00c25e);color:#fff;
box-shadow:0 4px 12px rgba(10,143,74,.25)}
.btn-danger{background:#fff;border-color:#fbb;color:var(--danger)}
.btn-danger:hover{background:#fee}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:6px 8px;border-radius:6px;background:#f5f7fb;border:1px solid var(--line);
color:var(--ink2);font-size:13px;line-height:1}
.btn-icon:hover{background:#fff;border-color:var(--brand);color:var(--brand)}

/* ORDER LIST */
.order-list{display:flex;flex-direction:column;gap:10px}
.order-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
padding:14px 16px;cursor:pointer;transition:.15s;box-shadow:0 1px 3px rgba(15,31,69,.06)}
.order-card:hover{border-color:var(--brand);box-shadow:0 4px 16px rgba(255,106,0,.1)}
.order-head{display:flex;justify-content:space-between;align-items:center;
margin-bottom:8px;gap:8px;flex-wrap:wrap}
.order-no{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;color:var(--ink2)}
.order-body b{font-size:14px;display:block;margin-bottom:2px}
.order-body .small{font-size:12.5px;color:var(--ink2)}
.order-foot{display:flex;justify-content:space-between;align-items:center;
margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:12.5px}
.order-foot span{color:var(--ink2)}
.order-foot b{font-size:14px;color:var(--brand)}

/* PILL */
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;
padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.baru{background:#e8f0ff;color:#2a5bd7}
.pill.produksi{background:#fff3d6;color:#a16a00}
.pill.qc{background:#e6f7ff;color:#0080a8}
.pill.selesai{background:#e8f9ee;color:var(--success)}
.pill.diambil{background:#f0f2f7;color:var(--ink2)}
.pill.belumbayar{background:#fee;color:var(--danger)}
.pill.lunas{background:#e8f9ee;color:var(--success)}

/* EMPTY */
.empty{text-align:center;padding:40px 20px;color:var(--ink2);
background:#fff;border:1px dashed var(--line);border-radius:var(--radius)}
.empty .ico{font-size:40px;opacity:.4;margin-bottom:8px}
.empty p{font-size:13px}

/* TABS */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;
margin-bottom:16px;-webkit-overflow-scrolling:touch}
.tab{padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;
background:#fff;border:1.5px solid var(--line);color:var(--ink2);
white-space:nowrap;transition:.15s}
.tab.active{background:linear-gradient(135deg,var(--brand),var(--brand2));
color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(255,106,0,.25)}

/* CARD */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
overflow:hidden;box-shadow:0 1px 3px rgba(15,31,69,.06)}
.card-head{display:flex;justify-content:space-between;align-items:center;
padding:14px 16px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.card-head h3{font-size:14px;font-weight:800}
.card-body{padding:16px}

/* INFO GRID */
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
@media(max-width:500px){.info-grid{grid-template-columns:1fr}}
.info-item .k{font-size:11px;color:var(--ink2);font-weight:700;
text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.info-item .v{font-weight:600;color:var(--ink);font-size:13.5px}

/* STATUS BAR */
.status-bar{display:flex;gap:6px;padding:4px;background:#f5f7fb;
border-radius:10px;overflow-x:auto}
.status-step{flex:1;padding:10px;text-align:center;border-radius:8px;
font-size:12.5px;font-weight:700;background:#fff;border:1px solid var(--line);
color:var(--ink3);white-space:nowrap;transition:.15s;cursor:pointer}
.status-step:hover{border-color:var(--brand)}
.status-step.done{background:#e8f9ee;border-color:#b8e6c9;color:var(--success)}
.status-step.active{background:linear-gradient(135deg,var(--brand),var(--brand2));
border-color:transparent;color:#fff;box-shadow:0 2px 8px rgba(255,106,0,.3)}

/* INVOICE CARD */
.invoice-card{background:linear-gradient(135deg,#fff8f2,#fff);border:1.5px solid #ffd7b8}
.invoice-empty{padding:20px;text-align:center;color:var(--ink2);font-size:13px}
.invoice-meta{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-bottom:14px}
@media(max-width:500px){.invoice-meta{grid-template-columns:1fr}}
.invoice-total{display:flex;justify-content:space-between;align-items:center;
padding:12px 14px;background:#fff;border-radius:10px;border:1px solid var(--line);
margin-top:10px}

/* HPP */
.hpp-box{background:#f9fafc;border:1px solid var(--line);border-radius:10px;padding:14px}
.hpp-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.hpp-row.total{border-top:1.5px dashed var(--line);margin-top:8px;
padding-top:10px;font-weight:800;font-size:14px}

/* TABLE */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:800;
color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;
border-bottom:1.5px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
tr:last-child td{border-bottom:0}
.mono{font-family:ui-monospace,monospace;font-size:12px}

/* MATERIAL LIST */
.mat-item{display:flex;align-items:center;gap:10px;padding:12px 0;
border-bottom:1px solid #f0f2f7}
.mat-item:last-child{border-bottom:0}
.mat-info{flex:1;min-width:0}
.mat-info b{font-size:13.5px;display:block}
.mat-info small{font-size:11.5px;color:var(--ink2)}
.mat-stock{text-align:right;font-size:13px}
.mat-stock b{display:block;font-size:14px}
.mat-actions{display:flex;gap:4px}
@media(max-width:500px){.mat-item{flex-wrap:wrap}.mat-stock{text-align:left}}

/* MODAL */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,31,69,.55);
backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;
padding:16px;overflow-y:auto}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:14px;width:100%;max-width:560px;
max-height:92vh;display:flex;flex-direction:column;
box-shadow:0 20px 60px rgba(0,0,0,.3);margin:auto}
.modal-card.wide{max-width:720px}
.modal-head{display:flex;justify-content:space-between;align-items:center;
padding:14px 18px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:15px;font-weight:800}
.modal-close{font-size:18px;width:32px;height:32px;border-radius:8px;
color:var(--ink2);display:grid;place-items:center}
.modal-close:hover{background:#f5f7fb}
.modal-body{padding:18px;overflow-y:auto;flex:1}

/* FORM */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;
border:1.5px solid var(--line);border-radius:8px;background:#f9fafc;
outline:none;transition:.15s;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{
border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(255,106,0,.1)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11px;color:var(--ink2);margin-top:3px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:500px){.form-row,.form-row.three{grid-template-columns:1fr}}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;
margin-top:18px;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-actions .btn-primary{min-width:110px}

/* TOAST */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);
background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;
font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);
opacity:0;transition:.3s;z-index:200;max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.success{background:var(--success)}
#toast.error{background:var(--danger)}

/* FAB */
.fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;
border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));
color:#fff;font-size:26px;font-weight:300;display:grid;place-items:center;
box-shadow:0 8px 24px rgba(255,106,0,.4);z-index:30;transition:.2s}
.fab:active{transform:scale(.95)}

/* REPORT */
.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:700px){.report-grid{grid-template-columns:1fr}}

/* ABOUT */
.about-row{display:flex;justify-content:space-between;padding:10px 0;
border-bottom:1px solid #f0f2f7;font-size:13px}
.about-row:last-child{border-bottom:0}
.about-row .k{color:var(--ink2);font-weight:600}
.about-row .v{font-weight:700}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <img src="logo.png" alt="Logo" class="login-logo" onerror="this.style.display='none'">
    <h1>CV Jaya Anugrah Tehnik</h1>
    <p class="login-sub">Sistem Manajemen Order &amp; Stok</p>
    <form id="loginForm" autocomplete="off">
      <label for="loginPass">Password</label>
      <input id="loginPass" type="password" placeholder="Masukkan password" required autocomplete="current-password">
      <button type="submit" id="loginBtn">Masuk</button>
      <div id="loginErr" class="login-err"></div>
    </form>
  </div>
</div>

<!-- APP -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <img src="logo.png" alt="" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <b>CV Jaya Anugrah Tehnik</b>
        <small>Sistem Manajemen</small>
      </div>
    </div>
    <div class="topbar-actions" id="topbarActions"></div>
  </header>
  <main id="content" class="content"></main>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
  <div class="modal-card" id="modalCard">
    <div class="modal-head">
      <h3 id="modalTitle">-</h3>
      <button class="modal-close" id="modalClose" type="button">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAehuT1RmzdPa4EuCrKIF9EQmnAYLfMR4M",
  authDomain: "project-client-381ae.firebaseapp.com",
  projectId: "project-client-381ae",
  storageBucket: "project-client-381ae.firebasestorage.app",
  messagingSenderId: "804908618382",
  appId: "1:804908618382:web:37e8fde2b09fb480ea2fdf"
};
const firebaseApp = initializeApp(firebaseConfig);
const db = getFirestore(firebaseApp);

const COL = {
  orders:'jayaanugrahteknik_orders',
  materials:'jayaanugrahteknik_materials',
  moves:'jayaanugrahteknik_moves',
  expenses:'jayaanugrahteknik_expenses',
  invoices:'jayaanugrahteknik_invoices'
};
const PASSWORD = 'banten01';
const SESSION_KEY = 'jat_logged_v1';

const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRp=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const fmtNum=n=>Number(n||0).toLocaleString('id-ID');
const fmtDate=d=>{if(!d)return'-';const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})};
const today=()=>new Date().toISOString().slice(0,10);
const thisYM=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};

const STATUSES=['Order','Selesai'];
const JENIS=['Hard Chrome','Teflon Coating','Metal Spray','Moulding Injection','Machining CNC','Bubut CNC','Fabrikasi','Bending','Lainnya'];
const SATUAN=['pcs','unit','set','kg','meter','liter','jam'];

const state={view:'dashboard',orderId:null,invoiceId:null,settingsTab:'materials',reportYM:null,
orders:[],materials:[],moves:[],expenses:[],invoices:[],
loaded:{orders:false,materials:false,moves:false,expenses:false,invoices:false},rendered:false};

function toast(msg,type=''){const t=$('#toast');t.textContent=msg;t.className='show '+type;
clearTimeout(t._t);t._t=setTimeout(()=>t.className='',3000)}

function isLoggedIn(){return localStorage.getItem(SESSION_KEY)==='1'}

function normalizeStatus(s){
  if(!s)return 'Order';
  if(s==='Order'||s==='Order Masuk'||s==='Produksi'||s==='QC')return 'Order';
  if(s==='Selesai'||s==='Diambil')return 'Selesai';
  return s;
}

$('#loginForm').addEventListener('submit',e=>{
  e.preventDefault();
  if($('#loginPass').value===PASSWORD){
    localStorage.setItem(SESSION_KEY,'1');
    $('#loginErr').textContent='';
    showApp();
  }else{
    $('#loginErr').textContent='Password salah.';
  }
});

function showApp(){
  $('#loginScreen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  $('#content').innerHTML='<div class="loading"><div class="spinner"></div><p>Memuat data dari server...</p></div>';
  $('#topbarActions').innerHTML='';
  subscribeAll();
}

function subscribeAll(){
  onSnapshot(collection(db,COL.orders),snap=>{
    state.orders=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    state.loaded.orders=true;tryRender();
  },err=>{console.error('orders',err);toast('Orders: '+err.message,'error')});

  onSnapshot(collection(db,COL.materials),snap=>{
    state.materials=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(a.nama||'').localeCompare(b.nama||''));
    state.loaded.materials=true;tryRender();
  },err=>{console.error('materials',err);toast('Materials: '+err.message,'error')});

  onSnapshot(collection(db,COL.moves),snap=>{
    state.moves=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    state.loaded.moves=true;tryRender();
  },err=>{console.error('moves',err);toast('Moves: '+err.message,'error')});

  onSnapshot(collection(db,COL.expenses),snap=>{
    state.expenses=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    state.loaded.expenses=true;tryRender();
  },err=>{console.error('expenses',err);toast('Expenses: '+err.message,'error')});

  onSnapshot(collection(db,COL.invoices),snap=>{
    state.invoices=snap.docs.map(d=>({id:d.id,...d.data()}))
      .sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
    state.loaded.invoices=true;tryRender();
  },err=>{console.error('invoices',err);toast('Invoices: '+err.message,'error')});
}

function tryRender(){
  if(Object.values(state.loaded).every(v=>v))render();
}

function render(){
  state.rendered=true;
  updateTopbar();
  const c=$('#content');
  if(state.view==='dashboard')c.innerHTML=renderDashboard();
  else if(state.view==='orderDetail')c.innerHTML=renderOrderDetail();
  else if(state.view==='invoiceDetail')c.innerHTML=renderInvoiceDetail();
  else if(state.view==='settings')c.innerHTML=renderSettings();
  attachEvents();
  window.scrollTo({top:0,behavior:'smooth'});
}

function updateTopbar(){
  const a=$('#topbarActions');
  if(state.view==='dashboard'){
    a.innerHTML='<button class="icon-btn" id="gearBtn" title="Pengaturan">⚙️</button>';
  }else if(state.view==='invoiceDetail'){
    a.innerHTML='<button class="icon-btn" id="backInvoiceBtn" title="Kembali">←</button>';
  }else{
    a.innerHTML='<button class="icon-btn" id="backBtn" title="Kembali">←</button>';
  }
}

function attachEvents(){
  const gear=$('#gearBtn');
  if(gear)gear.addEventListener('click',()=>{state.view='settings';state.settingsTab='materials';render()});
  const back=$('#backBtn');
  if(back)back.addEventListener('click',()=>{state.view='dashboard';state.orderId=null;render()});
  const backInv=$('#backInvoiceBtn');
  if(backInv)backInv.addEventListener('click',()=>{
    const inv=state.invoices.find(i=>i.id===state.invoiceId);
    if(inv&&inv.orderId){state.view='orderDetail';state.orderId=inv.orderId}
    else{state.view='dashboard'}
    render();
  });
  if(state.view==='dashboard')attachDashboardEvents();
  else if(state.view==='orderDetail')attachOrderDetailEvents();
  else if(state.view==='invoiceDetail')attachInvoiceDetailEvents();
  else if(state.view==='settings')attachSettingsEvents();
}

function findInvoiceByOrderId(orderId){
  return state.invoices.find(inv=>inv.orderId===orderId);
}

/* ============ DASHBOARD ============ */
function renderDashboard(){
  const ym=thisYM();
  const ordersThisMonth=state.orders.filter(o=>(o.tanggal||'').startsWith(ym));
  const activeOrders=state.orders.filter(o=>normalizeStatus(o.status)!=='Selesai');
  const doneThisMonth=ordersThisMonth.filter(o=>normalizeStatus(o.status)==='Selesai');
  const lowStock=state.materials.filter(m=>(m.stok||0)<=(m.stokMin||0));
  const recentOrders=state.orders.slice(0,20);

  let ordersHtml;
  if(!state.orders.length){
    ordersHtml=`<div class="empty"><div class="ico">📋</div><p>Belum ada order. Klik <b>+ Tambah Order</b> untuk mulai.</p></div>`;
  }else{
    ordersHtml='<div class="order-list">'+recentOrders.map(o=>{
      const inv=findInvoiceByOrderId(o.id);
      const invBadge=inv?`<span class="pill ${inv.status==='Lunas'?'lunas':'belumbayar'}">${inv.status}</span>`:'';
      return `<div class="order-card" data-id="${o.id}">
        <div class="order-head">
          <span class="order-no">${esc(o.noOrder)}</span>
          <div style="display:flex;gap:4px;flex-wrap:wrap">
            ${statusPill(o.status)}${invBadge}
          </div>
        </div>
        <div class="order-body">
          <b>${esc(o.pelanggan)}</b>
          <div class="small">${esc(o.jenis)} · ${fmtNum(o.jumlah)} ${esc(o.satuan)}</div>
        </div>
        <div class="order-foot">
          <span>${fmtDate(o.tanggal)}</span>
          <b>${fmtRp(o.nilaiOrder)}</b>
        </div>
      </div>`;
    }).join('')+'</div>';
  }

  return `
    <div class="stats">
      <div class="stat"><div class="stat-label">Order Bulan Ini</div>
        <div class="stat-value">${ordersThisMonth.length}</div>
        <div class="stat-sub">${activeOrders.length} aktif</div></div>
      <div class="stat teal"><div class="stat-label">Selesai Bulan Ini</div>
        <div class="stat-value">${doneThisMonth.length}</div>
        <div class="stat-sub">Order selesai</div></div>
      <div class="stat warn"><div class="stat-label">Total Material</div>
        <div class="stat-value">${state.materials.length}</div>
        <div class="stat-sub">${lowStock.length} kritis</div></div>
      <div class="stat ${lowStock.length?'danger':''}"><div class="stat-label">Stok Kritis</div>
        <div class="stat-value">${lowStock.length}</div>
        <div class="stat-sub">Perlu restock</div></div>
    </div>
    <div class="section-head">
      <h2>Daftar Order</h2>
      <button class="btn btn-primary" id="addOrderBtn">+ Tambah Order</button>
    </div>
    ${ordersHtml}
    <button class="fab" id="fabAddOrder" title="Tambah Order">+</button>`;
}

function statusPill(s){
  const map={'Order':'baru','Order Masuk':'baru','Produksi':'produksi','QC':'qc',
    'Selesai':'selesai','Diambil':'diambil'};
  return `<span class="pill ${map[s]||'baru'}">${esc(s)}</span>`;
}

function payPill(s){
  const map={'Lunas':'lunas','Belum Lunas':'belumbayar'};
  return `<span class="pill ${map[s]||'belumbayar'}">${esc(s)}</span>`;
}

function attachDashboardEvents(){
  $$('.order-card').forEach(c=>c.addEventListener('click',()=>{
    state.view='orderDetail';state.orderId=c.dataset.id;render();
  }));
  const a=$('#addOrderBtn');if(a)a.addEventListener('click',()=>openOrderForm());
  const f=$('#fabAddOrder');if(f)f.addEventListener('click',()=>openOrderForm());
}

function genOrderNo(){
  const d=new Date();
  const ym=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
  const prefix='SPK-'+ym+'-';
  const n=state.orders.filter(o=>(o.noOrder||'').startsWith(prefix)).length+1;
  return prefix+String(n).padStart(4,'0');
}

function genInvoiceNo(){
  const d=new Date();
  const ym=d.getFullYear()+String(d.getMonth()+1).padStart(2,'0');
  const prefix='INV-'+ym+'-';
  const n=state.invoices.filter(i=>(i.noInvoice||'').startsWith(prefix)).length+1;
  return prefix+String(n).padStart(4,'0');
}

      <div class="form-row">

        <div class="field"><label>Deadline</label>
          <input type="date" name="deadline" value="${esc(o.deadline)}"></div>
      </div>
      <div class="field"><label>Deskripsi Pekerjaan <span class="req">*</span></label>
        <textarea name="pekerjaan" required>${esc(o.pekerjaan)}</textarea></div>
      <div class="form-row three">
        <div class="field"><label>Jumlah</label>
          <input type="number" name="jumlah" value="${esc(o.jumlah)}" min="0" step="any"></div>

      </div>
      <div class="form-row">
        <div class="field"><label>Biaya Jasa Internal</label>
          <input type="number" name="biayaJasa" value="${esc(o.biayaJasa)}" min="0"></div>
        <div class="field"><label>Status</label>
          <select name="status">${STATUSES.map(s=>`<option ${s===curStatus?'selected':''}>${s}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Catatan</label>

        <button type="submit" class="btn btn-primary" id="submitForm">${isEdit?'Simpan':'Simpan Order'}</button>
      </div>

    const fd=new FormData(e.target);

    const data={
      noOrder:fd.get('noOrder'),tanggal:fd.get('tanggal'),

        toast('Order ditambahkan.','success');

/* ============ ORDER DETAIL ============ */
function renderOrderDetail(){
  const o=state.orders.find(x=>x.id===state.orderId);
  if(!o)return `<div class="empty"><p>Order tidak ditemukan.</p></div>`;
  const moves=state.moves.filter(m=>m.orderId===o.id&&m.tipe==='keluar');
  const materialCost=moves.reduce((s,m)=>s+(m.harga||0)*(m.jumlah||0),0);
  const hpp=(+o.biayaJasa||0)+materialCost;
  const margin=(+o.nilaiOrder||0)-hpp;
  const normStatus=normalizeStatus(o.status);
  const cur=STATUSES.indexOf(normStatus);
  const invoice=findInvoiceByOrderId(o.id);

  const movesHtml=moves.length?`
    <div class="table-wrap"><table>
      <thead><tr><th>Material</th><th class="text-right">Qty</th>
      <th class="text-right">Subtotal</th><th></th></tr></thead>
      <tbody>${moves.map(m=>`
        <tr><td>${esc(m.materialNama)}</td>
        <td class="text-right">${fmtNum(m.jumlah)} ${esc(m.satuan)}</td>
        <td class="text-right mono">${fmtRp((m.harga||0)*(m.jumlah||0))}</td>
        <td class="text-right"><button class="btn-icon" data-del-move="${m.id}">🗑</button></td></tr>`).join('')}
      </tbody></table></div>`:
    `<div class="empty" style="padding:20px;background:transparent;border:0">
      <p style="font-size:12.5px">Belum ada pemakaian material.</p></div>`;

  // Invoice section
  let invoiceSection;
  if(invoice){
    invoiceSection=`
      <div class="card invoice-card" style="margin-bottom:14px">
        <div class="card-head">
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
            <h3>🧾 ${esc(invoice.noInvoice)}</h3>
            ${payPill(invoice.status)}
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-ghost btn-sm" id="viewInvoiceBtn">Lihat Invoice</button>
            <button class="btn btn-primary btn-sm" id="shareInvoiceBtn">📤 Share PDF</button>
          </div>
        </div>
        <div class="card-body" style="padding:14px 16px">
          <div style="display:flex;justify-content:space-between;font-size:13px">
            <span>Total Invoice</span>
            <b style="color:var(--brand);font-size:15px">${fmtRp(invoice.total)}</b>
          </div>
          ${invoice.status==='Lunas'&&invoice.paidAt?`<div style="font-size:11.5px;color:var(--success);margin-top:4px">
            ✓ Dibayar ${fmtDate(invoice.paidAt)}</div>`:''}
        </div>
      </div>`;
  }else{
    invoiceSection=`
      <div class="card" style="margin-bottom:14px">
        <div class="card-head"><h3>🧾 Invoice</h3></div>
        <div class="invoice-empty">
          <p style="margin-bottom:12px">Belum ada invoice untuk order ini.</p>
          <button class="btn btn-primary" id="createInvoiceBtn">+ Buat Invoice</button>
        </div>
      </div>`;
  }

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="card-head">
        <div><span class="order-no">${esc(o.noOrder)}</span> ${statusPill(o.status)}</div>
        <div style="display:flex;gap:6px">
          <button class="btn btn-ghost btn-sm" id="editOrder">✏ Edit</button>
          <button class="btn btn-danger btn-sm" id="deleteOrder">🗑 Hapus</button>
        </div>
      </div>
      <div class="card-body">
        <div class="info-grid">
          <div class="info-item"><div class="k">Pelanggan</div><div class="v">${esc(o.pelanggan)}</div></div>
          <div class="info-item"><div class="k">Telepon</div><div class="v">${esc(o.telepon)||'-'}</div></div>
          <div class="info-item"><div class="k">Jenis</div><div class="v">${esc(o.jenis)}</div></div>
          <div class="info-item"><div class="k">Jumlah</div><div class="v">${fmtNum(o.jumlah)} ${esc(o.satuan)}</div></div>
          <div class="info-item"><div class="k">Tanggal</div><div class="v">${fmtDate(o.tanggal)}</div></div>
          <div class="info-item"><div class="k">Deadline</div><div class="v">${o.deadline?fmtDate(o.deadline):'-'}</div></div>
          <div class="info-item" style="grid-column:1/-1"><div class="k">Deskripsi</div><div class="v">${esc(o.pekerjaan)}</div></div>
          ${o.catatan?`<div class="info-item" style="grid-column:1/-1"><div class="k">Catatan</div><div class="v">${esc(o.catatan)}</div></div>`:''}
        </div>
      </div>
    </div>
    ${invoiceSection}
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3>Status Order</h3></div>
      <div class="card-body">
        <div class="status-bar">${STATUSES.map((s,i)=>{
          let cls='';if(i<cur)cls='done';else if(i===cur)cls='active';
          return `<button class="status-step ${cls}" data-status="${s}">${s}</button>`;
        }).join('')}</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div class="card-head"><h3>Pemakaian Material</h3>

        ${o.nilaiOrder>0?`<div class="hpp-row"><span style="color:var(--ink2);font-size:12px">Margin</span>
          <b style="color:${margin>=0?'var(--success)':'var(--danger)'}">${((margin/o.nilaiOrder)*100).toFixed(1)}%</b></div>`:''}
      </div></div>
    </div>`;
}

function attachOrderDetailEvents(){
  const id=state.orderId;
  const o=state.orders.find(x=>x.id===id);
  if(!o)return;
  $('#editOrder').addEventListener('click',()=>openOrderForm(o));
  $('#deleteOrder').addEventListener('click',async()=>{
    if(!confirm('Hapus order '+o.noOrder+'? Invoice terkait juga akan dihapus.'))return;
    try{
      const inv=findInvoiceByOrderId(id);
      if(inv)await deleteDoc(doc(db,COL.invoices,inv.id));
      await deleteDoc(doc(db,COL.orders,id));
      toast('Order dihapus.','success');
      state.view='dashboard';state.orderId=null;render();
    }catch(err){toast('Gagal: '+err.message,'error')}
  });
  $$('[data-status]').forEach(b=>b.addEventListener('click',async()=>{
    if(b.dataset.status===normalizeStatus(o.status))return;
    try{await updateDoc(doc(db,COL.orders,id),{status:b.dataset.status});
      toast('Status: '+b.dataset.status,'success');
    }catch(err){toast('Gagal: '+err.message,'error')}
  }));
  $('#addUsage').addEventListener('click',()=>openUsageForm(o));
  $$('[data-del-move]').forEach(b=>b.addEventListener('click',async()=>{
    if(!confirm('Hapus pemakaian ini? Stok akan dikembalikan.'))return;
    const mv=state.moves.find(x=>x.id===b.dataset.delMove);if(!mv)return;
    try{
      const mat=state.materials.find(m=>m.id===mv.materialId);
      if(mat)await updateDoc(doc(db,COL.materials,mat.id),{stok:(mat.stok||0)+mv.jumlah});
      await deleteDoc(doc(db,COL.moves,mv.id));
      toast('Pemakaian dihapus.','success');
    }catch(err){toast('Gagal: '+err.message,'error')}
  }));

  const createBtn=$('#createInvoiceBtn');
  if(createBtn)createBtn.addEventListener('click',()=>openInvoiceForm(o));

  const viewBtn=$('#viewInvoiceBtn');
  if(viewBtn)viewBtn.addEventListener('click',()=>{
    const inv=findInvoiceByOrderId(o.id);
    if(inv){state.view='invoiceDetail';state.invoiceId=inv.id;render()}
  });

  const shareBtn=$('#shareInvoiceBtn');
  if(shareBtn)shareBtn.addEventListener('click',()=>{
    const inv=findInvoiceByOrderId(o.id);
    if(inv)shareInvoicePDF(inv,o);
  });
}

/* ============ USAGE FORM ============ */
function openUsageForm(order){
  if(!state.materials.length){toast('Belum ada material. Tambahkan dulu di Pengaturan.','error');return}
  openModal('Tambah Pemakaian Material',`
    <form id="usageForm">
      <div class="field"><label>Material <span class="req">*</span></label>
        <select name="materialId" required>${state.materials.map(m=>
          `<option value="${m.id}">${esc(m.nama)} (stok: ${fmtNum(m.stok)} ${esc(m.satuan)})</option>`).join('')}
        </select></div>
      <div class="field"><label>Jumlah <span class="req">*</span></label>
        <input type="number" name="jumlah" required min="0.01" step="any" value="1"></div>
      <div class="field"><label>Keterangan</label>
        <input name="ket" placeholder="Opsional"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelUsage">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitUsage">Simpan</button>
      </div>
    </form>`);
  $('#cancelUsage').addEventListener('click',closeModal);
  $('#usageForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const matId=fd.get('materialId');const qty=+fd.get('jumlah');
    const mat=state.materials.find(m=>m.id===matId);
    if(!mat||!qty)return;
    if(qty>(mat.stok||0)){toast('Stok tidak cukup (tersedia: '+fmtNum(mat.stok)+').','error');return}
    const btn=$('#submitUsage');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      await updateDoc(doc(db,COL.materials,mat.id),{stok:(mat.stok||0)-qty});
      await addDoc(collection(db,COL.moves),{
        materialId:mat.id,materialNama:mat.nama,satuan:mat.satuan,tipe:'keluar',
        jumlah:qty,harga:mat.harga||0,
        keterangan:fd.get('ket').trim()||('Pemakaian order '+order.noOrder),
        orderId:order.id,tanggal:today(),createdAt:Date.now()
      });
      toast('Pemakaian dicatat.','success');closeModal();
    }catch(err){console.error(err);toast('Gagal: '+err.message,'error');
      btn.disabled=false;btn.textContent='Simpan'}
  });
}

/* ============ INVOICE FORM ============ */
function openInvoiceForm(order,edit=null){
  const isEdit=!!edit;
  const inv=edit||{noInvoice:genInvoiceNo(),tanggal:today(),
    subtotal:order.nilaiOrder||0,ppn:0,note:order.catatan||''};
  openModal(isEdit?'Edit Invoice':'Buat Invoice — '+order.noOrder,`
    <form id="invoiceForm">
      <div class="form-row">
        <div class="field"><label>No. Invoice</label>
          <input name="noInvoice" value="${esc(inv.noInvoice)}" readonly style="background:#f0f2f7"></div>
        <div class="field"><label>Tanggal <span class="req">*</span></label>
          <input type="date" name="tanggal" value="${esc(inv.tanggal)}" required></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Subtotal (Rp) <span class="req">*</span></label>
          <input type="number" name="subtotal" value="${esc(inv.subtotal)}" min="0" required id="invSubtotal"></div>
        <div class="field"><label>PPN (%)</label>
          <input type="number" name="ppn" value="${esc(inv.ppn)}" min="0" max="100" step="any" id="invPpn"></div>
      </div>
      <div style="background:#f9fafc;padding:12px;border-radius:8px;margin-bottom:14px;
        display:flex;justify-content:space-between;align-items:center;font-size:14px">
        <span>Total:</span><b id="invTotalDisplay" style="color:var(--brand);font-size:16px">${fmtRp(inv.subtotal)}</b>
      </div>
      <div class="field"><label>Catatan Invoice</label>
        <textarea name="note">${esc(inv.note)}</textarea></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelInvoice">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitInvoice">${isEdit?'Simpan':'Buat Invoice'}</button>
      </div>
    </form>`,{wide:true});

  const updateTotal=()=>{
    const sub=+$('#invSubtotal').value||0;
    const ppn=+$('#invPpn').value||0;
    const total=sub+(sub*ppn/100);
    $('#invTotalDisplay').textContent=fmtRp(total);
  };
  $('#invSubtotal').addEventListener('input',updateTotal);
  $('#invPpn').addEventListener('input',updateTotal);

  $('#cancelInvoice').addEventListener('click',closeModal);
  $('#invoiceForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const subtotal=+fd.get('subtotal')||0;
    const ppn=+fd.get('ppn')||0;
    const total=subtotal+(subtotal*ppn/100);
    const data={
      orderId:order.id,noInvoice:fd.get('noInvoice'),
      tanggal:fd.get('tanggal'),subtotal,ppn,total,
      note:fd.get('note').trim(),
      status:isEdit?inv.status:'Belum Lunas',
      paidAt:isEdit?inv.paidAt:null
    };
    const btn=$('#submitInvoice');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      if(isEdit){
        await updateDoc(doc(db,COL.invoices,edit.id),data);
        toast('Invoice diperbarui.','success');
      }else{
        const ref=await addDoc(collection(db,COL.invoices),{...data,createdAt:Date.now()});
        toast('Invoice dibuat.','success');
        state.view='invoiceDetail';state.invoiceId=ref.id;closeModal();render();return;
      }
      closeModal();
    }catch(err){console.error(err);toast('Gagal: '+err.message,'error');
      btn.disabled=false;btn.textContent=isEdit?'Simpan':'Buat Invoice'}
  });
}

function attachInvoiceDetailEvents(){
  const inv=state.invoices.find(x=>x.id===state.invoiceId);
  if(!inv)return;
  const o=state.orders.find(x=>x.id===inv.orderId);

  const ml=$('#markLunasBtn');
  if(ml)ml.addEventListener('click',async()=>{
    if(!confirm('Tandai invoice ini sebagai LUNAS?'))return;
    try{
      await updateDoc(doc(db,COL.invoices,inv.id),{status:'Lunas',paidAt:today()});
      toast('Invoice ditandai LUNAS.','success');
    }catch(err){toast('Gagal: '+err.message,'error')}
  });

  const mu=$('#markUnpaidBtn');
  if(mu)mu.addEventListener('click',async()=>{

      await updateDoc(doc(db,COL.invoices,inv.id),{status:'Belum Lunas',paidAt:null});
      toast('Status dikembalikan ke Belum Lunas.','success');
    }catch(err){toast('Gagal: '+err.message,'error')}

  if(sp)sp.addEventListener('click',()=>shareInvoicePDF(inv,o));

  if(ei)ei.addEventListener('click',()=>openInvoiceForm(o,inv));

  });

async function loadHtml2Pdf(){
  if(window.html2pdf)return window.html2pdf;
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload=()=>resolve(window.html2pdf);
    s.onerror=()=>reject(new Error('Gagal memuat library PDF'));
    document.head.appendChild(s);
  });
}

async function shareInvoicePDF(inv,order){
  toast('Membuat PDF...');
  let wrapper=null;
  try{
    const html2pdf=await loadHtml2Pdf();
    wrapper=document.createElement('div');
    wrapper.style.cssText='position:fixed;left:-99999px;top:0;z-index:-1';
    wrapper.innerHTML=buildInvoicePrintHTML(inv,order);
    document.body.appendChild(wrapper);

    // Wait for images
    const imgs=wrapper.querySelectorAll('img');
    await Promise.all([...imgs].map(img=>{
      if(img.complete)return Promise.resolve();
      return new Promise(r=>{img.onload=img.onerror=r});
    }));
    await new Promise(r=>setTimeout(r,100));

    const opt={
      margin:0,
      filename:inv.noInvoice+'.pdf',
      image:{type:'jpeg',quality:0.95},
      html2canvas:{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false},
      jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}
    };
    const blob=await html2pdf().set(opt).from(wrapper.firstElementChild).outputPdf('blob');
    document.body.removeChild(wrapper);wrapper=null;

    const file=new File([blob],inv.noInvoice+'.pdf',{type:'application/pdf'});

    // Try share
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:'Invoice '+inv.noInvoice,
          text:'Invoice dari CV Jaya Anugrah Tehnik - '+inv.noInvoice
        });
        toast('PDF berhasil dibagikan.','success');
      }catch(err){
        if(err.name==='AbortError'){toast('Dibatalkan.','')}
        else{throw err}
      }
    }else{
      // Fallback download
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');
      a.href=url;a.download=inv.noInvoice+'.pdf';
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      setTimeout(()=>URL.revokeObjectURL(url),1000);
      toast('PDF diunduh. Silakan share manual.','success');
    }
  }catch(err){
    console.error(err);
    if(wrapper&&document.body.contains(wrapper))document.body.removeChild(wrapper);
    toast('Gagal membuat PDF: '+(err.message||'unknown'),'error');
  }
}

function renderReportsTab(){
  const ym=state.reportYM||thisYM();
  const orders=state.orders.filter(o=>(o.tanggal||'').startsWith(ym));
  const revenue=orders.filter(o=>normalizeStatus(o.status)==='Selesai')
    .reduce((s,o)=>s+(+o.nilaiOrder||0),0);
  const expenses=state.expenses.filter(x=>(x.tanggal||'').startsWith(ym))
    .reduce((s,x)=>s+(+x.jumlah||0),0);
  const profit=revenue-expenses;
  const byCust={};
  orders.forEach(o=>{if(!byCust[o.pelanggan])byCust[o.pelanggan]={count:0,total:0};
    byCust[o.pelanggan].count++;byCust[o.pelanggan].total+=(+o.nilaiOrder||0)});
  const topCust=Object.entries(byCust).sort((a,b)=>b[1].total-a[1].total).slice(0,10);
  const byJenis={};
  orders.forEach(o=>{if(!byJenis[o.jenis])byJenis[o.jenis]={count:0,total:0};
    byJenis[o.jenis].count++;byJenis[o.jenis].total+=(+o.nilaiOrder||0)});
  const topJenis=Object.entries(byJenis).sort((a,b)=>b[1].total-a[1].total);

  return `<div class="section-head">
      <h2>Laporan Bulanan</h2>
      <input type="month" id="reportMonth" value="${ym}"
        style="padding:8px 12px;border-radius:8px;border:1.5px solid var(--line);outline:none;background:#fff">
    </div>
    <div class="stats" style="margin-bottom:16px">
      <div class="stat teal"><div class="stat-label">Pendapatan</div>
        <div class="stat-value">${fmtRp(revenue)}</div></div>
      <div class="stat danger"><div class="stat-label">Pengeluaran</div>
        <div class="stat-value">${fmtRp(expenses)}</div></div>
      <div class="stat ${profit>=0?'teal':''}"><div class="stat-label">Laba Bersih</div>
        <div class="stat-value" style="color:${profit>=0?'var(--success)':'var(--danger)'}">${fmtRp(profit)}</div></div>
      <div class="stat warn"><div class="stat-label">Total Order</div>
        <div class="stat-value">${orders.length}</div></div>
    </div>
    <div class="report-grid">
      <div class="card"><div class="card-head"><h3>Top Pelanggan</h3></div>
        ${topCust.length?`<div class="table-wrap"><table>
          <thead><tr><th>Pelanggan</th><th class="text-right">Order</th><th class="text-right">Total</th></tr></thead>
          <tbody>${topCust.map(([k,v])=>`<tr><td>${esc(k)}</td>
            <td class="text-right">${v.count}</td>
            <td class="text-right mono">${fmtRp(v.total)}</td></tr>`).join('')}</tbody></table></div>`:
          `<div class="empty" style="padding:30px"><p>Belum ada data.</p></div>`}
      </div>
      <div class="card"><div class="card-head"><h3>Per Jenis Pekerjaan</h3></div>
        ${topJenis.length?`<div class="table-wrap"><table>
          <thead><tr><th>Jenis</th><th class="text-right">Order</th><th class="text-right">Total</th></tr></thead>
          <tbody>${topJenis.map(([k,v])=>`<tr><td>${esc(k)}</td>
            <td class="text-right">${v.count}</td>
            <td class="text-right mono">${fmtRp(v.total)}</td></tr>`).join('')}</tbody></table></div>`:
          `<div class="empty" style="padding:30px"><p>Belum ada data.</p></div>`}
      </div>
    </div>`;
}

function attachSettingsEvents(){
  $$('.tab').forEach(t=>t.addEventListener('click',()=>{
    state.settingsTab=t.dataset.tab;render();
  }));
  if(state.settingsTab==='materials'){
    const a=$('#addMatBtn');if(a)a.addEventListener('click',()=>openMatForm());
    $$('[data-edit]').forEach(b=>b.addEventListener('click',()=>
      openMatForm(state.materials.find(m=>m.id===b.dataset.edit))));
    $$('[data-del]').forEach(b=>b.addEventListener('click',async()=>{
      const m=state.materials.find(x=>x.id===b.dataset.del);
      if(!m||!confirm('Hapus material "'+m.nama+'"?'))return;
      try{await deleteDoc(doc(db,COL.materials,m.id));toast('Material dihapus.','success')}
      catch(err){toast('Gagal: '+err.message,'error')}
    }));
    $$('[data-in]').forEach(b=>b.addEventListener('click',()=>openMoveForm(b.dataset.in,'masuk')));
    $$('[data-out]').forEach(b=>b.addEventListener('click',()=>openMoveForm(b.dataset.out,'keluar')));
    $$('[data-hist]').forEach(b=>b.addEventListener('click',()=>showHistory(b.dataset.hist)));
  }
  if(state.settingsTab==='expenses'){
    const a=$('#addExpBtn');if(a)a.addEventListener('click',()=>openExpForm());
    $$('[data-exp-del]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Hapus pengeluaran ini?'))return;
      try{await deleteDoc(doc(db,COL.expenses,b.dataset.expDel));toast('Dihapus.','success')}
      catch(err){toast('Gagal: '+err.message,'error')}
    }));
  }
  if(state.settingsTab==='invoices'){
    $$('[data-inv-id]').forEach(tr=>tr.addEventListener('click',()=>{
      state.view='invoiceDetail';state.invoiceId=tr.dataset.invId;render();
    }));
  }
  if(state.settingsTab==='reports'){
    const mi=$('#reportMonth');
    if(mi)mi.addEventListener('change',()=>{state.reportYM=mi.value;render()});
  }
  if(state.settingsTab==='about'){
    const lo=$('#logoutBtn');
    if(lo)lo.addEventListener('click',()=>{
      if(!confirm('Keluar dari aplikasi?'))return;
      localStorage.removeItem(SESSION_KEY);location.reload();
    });
  }
}

/* ============ MATERIAL FORM ============ */
function openMatForm(edit=null){
  const m=edit||{nama:'',satuan:'kg',harga:0,stok:0,stokMin:0,supplier:''};
  openModal(edit?'Edit Material':'Tambah Material',`
    <form id="matForm">
      <div class="field"><label>Nama Material <span class="req">*</span></label>
        <input name="nama" required value="${esc(m.nama)}"></div>
      <div class="form-row three">
        <div class="field"><label>Satuan <span class="req">*</span></label>
          <select name="satuan">${SATUAN.map(s=>`<option ${s===m.satuan?'selected':''}>${s}</option>`).join('')}</select></div>
        <div class="field"><label>Harga/Satuan <span class="req">*</span></label>
          <input type="number" name="harga" required min="0" value="${esc(m.harga)}"></div>
        <div class="field"><label>Stok Awal</label>
          <input type="number" name="stok" min="0" step="any" value="${esc(m.stok)}" ${edit?'readonly style="background:#f0f2f7"':''}></div>
      </div>
      <div class="form-row">
        <div class="field"><label>Stok Minimum</label>
          <input type="number" name="stokMin" min="0" step="any" value="${esc(m.stokMin)}"></div>
        <div class="field"><label>Supplier</label>
          <input name="supplier" value="${esc(m.supplier)}"></div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelMat">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitMat">${edit?'Simpan':'Tambah'}</button>
      </div>
    </form>`);
  $('#cancelMat').addEventListener('click',closeModal);
  $('#matForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const data={nama:fd.get('nama').trim(),satuan:fd.get('satuan'),
      harga:+fd.get('harga')||0,stokMin:+fd.get('stokMin')||0,
      supplier:fd.get('supplier').trim()};
    if(!edit)data.stok=+fd.get('stok')||0;
    const btn=$('#submitMat');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      if(edit){await updateDoc(doc(db,COL.materials,edit.id),data);toast('Material diperbarui.','success')}
      else{await addDoc(collection(db,COL.materials),{...data,createdAt:Date.now()});toast('Material ditambahkan.','success')}
      closeModal();
    }catch(err){console.error(err);toast('Gagal: '+err.message,'error');
      btn.disabled=false;btn.textContent=edit?'Simpan':'Tambah'}
  });
}

function openMoveForm(matId,tipe){
  const m=state.materials.find(x=>x.id===matId);if(!m)return;
  openModal((tipe==='masuk'?'Stok Masuk':'Stok Keluar')+' — '+m.nama,`
    <form id="moveForm">
      <div style="background:#f9fafc;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px">
        <b>${esc(m.nama)}</b> — stok saat ini: <b>${fmtNum(m.stok)} ${esc(m.satuan)}</b></div>
      <div class="form-row">
        <div class="field"><label>Jumlah <span class="req">*</span></label>
          <input type="number" name="jumlah" required min="0.01" step="any" value="1"></div>
        <div class="field"><label>Tanggal</label>
          <input type="date" name="tanggal" value="${today()}"></div>
      </div>
      <div class="field"><label>Keterangan</label>
        <input name="ket" placeholder="${tipe==='masuk'?'Pembelian':'Pemakaian'}"></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelMove">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitMove">Simpan</button>
      </div>
    </form>`);
  $('#cancelMove').addEventListener('click',closeModal);
  $('#moveForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const qty=+fd.get('jumlah');if(!qty)return;
    if(tipe==='keluar'&&qty>(m.stok||0)){
      toast('Stok tidak cukup (tersedia: '+fmtNum(m.stok)+').','error');return;
    }
    const newStok=tipe==='masuk'?(m.stok||0)+qty:(m.stok||0)-qty;
    const btn=$('#submitMove');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      await updateDoc(doc(db,COL.materials,m.id),{stok:newStok});
      await addDoc(collection(db,COL.moves),{
        materialId:m.id,materialNama:m.nama,satuan:m.satuan,tipe,jumlah:qty,
        harga:m.harga||0,
        keterangan:fd.get('ket').trim()||(tipe==='masuk'?'Stok masuk':'Stok keluar'),
        orderId:null,tanggal:fd.get('tanggal')||today(),createdAt:Date.now()
      });
      toast('Stok diperbarui.','success');closeModal();
    }catch(err){console.error(err);toast('Gagal: '+err.message,'error');
      btn.disabled=false;btn.textContent='Simpan'}
  });
}

function showHistory(matId){
  const m=state.materials.find(x=>x.id===matId);if(!m)return;
  const list=state.moves.filter(x=>x.materialId===matId).slice(0,50);
  openModal('Riwayat Stok — '+m.nama,`
    ${list.length?`<div class="table-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Tipe</th><th class="text-right">Jumlah</th>
      <th>Keterangan</th></tr></thead>
      <tbody>${list.map(x=>`<tr>
        <td>${fmtDate(x.tanggal)}</td>
        <td><span class="pill ${x.tipe==='masuk'?'selesai':'produksi'}">${x.tipe}</span></td>
        <td class="text-right"><b>${x.tipe==='masuk'?'+':'−'}${fmtNum(x.jumlah)}</b> ${esc(x.satuan)}</td>
        <td>${esc(x.keterangan)||'-'}</td></tr>`).join('')}</tbody></table></div>`:
      `<div class="empty" style="padding:24px"><p>Belum ada riwayat.</p></div>`}
    <div class="modal-actions"><button class="btn btn-ghost" id="closeHist">Tutup</button></div>`,
    {wide:true});
  $('#closeHist').addEventListener('click',closeModal);
}

/* ============ EXPENSE FORM ============ */
function openExpForm(){
  openModal('Tambah Pengeluaran',`
    <form id="expForm">
      <div class="form-row">
        <div class="field"><label>Tanggal <span class="req">*</span></label>
          <input type="date" name="tanggal" value="${today()}" required></div>
        <div class="field"><label>Kategori <span class="req">*</span></label>
          <select name="kategori">
            <option>Beli Material</option><option>Operasional</option>
            <option>Listrik &amp; Air</option><option>Gaji</option>
            <option>Transport</option><option>Maintenance</option><option>Lainnya</option>
          </select></div>
      </div>
      <div class="field"><label>Keterangan <span class="req">*</span></label>
        <input name="keterangan" required></div>
      <div class="field"><label>Jumlah <span class="req">*</span></label>
        <input type="number" name="jumlah" min="0" required></div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="cancelExp">Batal</button>
        <button type="submit" class="btn btn-primary" id="submitExp">Simpan</button>
      </div>
    </form>`);
  $('#cancelExp').addEventListener('click',closeModal);
  $('#expForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const btn=$('#submitExp');btn.disabled=true;btn.textContent='Menyimpan...';
    try{
      await addDoc(collection(db,COL.expenses),{
        tanggal:fd.get('tanggal'),kategori:fd.get('kategori'),
        keterangan:fd.get('keterangan').trim(),jumlah:+fd.get('jumlah')||0,
        createdAt:Date.now()
      });
      toast('Pengeluaran dicatat.','success');closeModal();
    }catch(err){console.error(err);toast('Gagal: '+err.message,'error');
      btn.disabled=false;btn.textContent='Simpan'}
  });
}

/* ============ MODAL ============ */
function openModal(title,bodyHTML,opts={}){
  $('#modalTitle').textContent=title;
  $('#modalBody').innerHTML=bodyHTML;
  $('#modalCard').classList.toggle('wide',!!opts.wide);
  $('#modal').classList.add('open');
}
function closeModal(){
  $('#modal').classList.remove('open');
  setTimeout(()=>{$('#modalBody').innerHTML=''},200);
}
$('#modalClose').addEventListener('click',closeModal);
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal'))closeModal()});

/* ============ INIT ============ */
if(isLoggedIn())showApp();
else $('#loginScreen').classList.remove('hidden');

window.closeModal=closeModal;
</script>
