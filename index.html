<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CV Jaya Anugrah Tehnik — Sistem Manajemen</title>
<style>
:root{
  --ink:#0f1f45;--ink2:#4a5878;--ink3:#8b95ab;
  --brand:#ff6a00;--brand2:#ffab00;--teal:#00b8a9;
  --bg:#f5f7fb;--card:#fff;--line:#e4e8f0;
  --danger:#e53935;--success:#0a8f4a;--warning:#e6a000;
  --radius:12px;--shadow:0 2px 12px rgba(15,31,69,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;
  -webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink)}
img{max-width:100%;display:block}
.hidden{display:none!important}

/* Loading */
.loading{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;z-index:9999}
.spinner{width:40px;height:40px;border:4px solid var(--line);
  border-top-color:var(--brand);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:24px;background:linear-gradient(135deg,#0f1f45,#1e3268);position:relative;overflow:hidden}
.login::before{content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 20% 20%,rgba(255,106,0,.15),transparent 50%),
    radial-gradient(circle at 80% 80%,rgba(0,184,169,.12),transparent 50%)}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;
  box-shadow:0 24px 60px rgba(0,0,0,.3);position:relative;z-index:1;text-align:center}
.login-card img{max-height:80px;margin:0 auto 16px}
.login-card h1{font-size:18px;font-weight:800;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--ink2);margin-bottom:24px}
.login-card input{width:100%;padding:12px 14px;border-radius:10px;
  border:1.5px solid var(--line);background:#f9fafc;outline:none;font-size:15px;
  transition:.2s;margin-bottom:12px;text-align:center}
.login-card input:focus{border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 4px rgba(255,106,0,.1)}
.login-card button{width:100%;padding:13px;border-radius:10px;font-weight:800;font-size:14px;
  background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 8px 24px rgba(255,106,0,.3);transition:.2s}
.login-card button:hover{transform:translateY(-1px)}
.login-err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}

/* Header */
.app-header{background:#fff;border-bottom:1px solid var(--line);
  padding:10px 20px;display:flex;align-items:center;justify-content:space-between;
  gap:12px;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.03)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{max-height:40px;max-width:56px;flex-shrink:0}
.brand div{min-width:0}
.brand b{font-size:14px;font-weight:800;line-height:1.2;display:block}
.brand small{font-size:11px;color:var(--ink2);font-weight:600}
.gear-btn{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:20px;background:#f5f7fb;border:1px solid var(--line);
  transition:.2s;flex-shrink:0}
.gear-btn:hover{background:#fff;border-color:var(--brand);
  box-shadow:0 4px 12px rgba(255,106,0,.15);transform:rotate(30deg)}

/* Main */
.app-main{padding:20px;max-width:1200px;margin:0 auto}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:700px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--brand),var(--brand2))}
.stat.teal::before{background:linear-gradient(90deg,var(--teal),#00d4c2)}
.stat.danger::before{background:linear-gradient(90deg,var(--danger),#ff6b68)}
.stat.warning::before{background:linear-gradient(90deg,var(--warning),#ffc44d)}
.stat .label{font-size:11px;color:var(--ink2);font-weight:700;text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:6px}
.stat .value{font-size:20px;font-weight:800;line-height:1.2}
.stat .sub{font-size:11px;color:var(--ink2);margin-top:3px}

.section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);overflow:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.section-head h2{font-size:16px;font-weight:800}

.toolbar{padding:12px 20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  border-bottom:1px solid var(--line);background:#fafbfd}
.toolbar input,.toolbar select{padding:8px 12px;border-radius:8px;
  border:1.5px solid var(--line);background:#fff;outline:none;font-size:13px;transition:.15s}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{border-color:var(--brand);
  box-shadow:0 0 0 3px rgba(255,106,0,.08)}

/* Orders */
.orders-list{padding:8px}
.order-card{padding:14px 16px;border-radius:10px;border:1px solid transparent;
  transition:.15s;cursor:pointer;display:grid;
  grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;margin-bottom:4px}
.order-card:hover{background:#fafbfd;border-color:var(--line)}
@media(max-width:700px){
  .order-card{grid-template-columns:1fr auto;gap:8px;padding:12px}
  .order-card .order-no{grid-column:1/-1}
  .order-card .order-jenis{grid-column:1/-1;font-size:12px}
}
.order-no{font-family:ui-monospace,monospace;font-size:12px;font-weight:700;
  color:var(--brand);white-space:nowrap}
.order-pelanggan{min-width:0}
.order-pelanggan b{font-size:13.5px;display:block;line-height:1.2;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-pelanggan small{font-size:11.5px;color:var(--ink2)}
.order-jenis{font-size:12.5px;color:var(--ink2)}
.order-nilai{font-weight:700;font-size:13.5px;white-space:nowrap}
.order-status{white-space:nowrap}

.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:800;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.baru{background:#e8f0ff;color:#2a5bd7}
.pill.produksi{background:#fff3d6;color:#a16a00}
.pill.qc{background:#e6f7ff;color:#0080a8}
.pill.selesai{background:#e8f9ee;color:var(--success)}
.pill.diambil{background:#f0f2f7;color:#4a5878}
.pill.kritis{background:#fee;color:var(--danger)}
.pill.ok{background:#e8f9ee;color:var(--success)}
.pill.lunas{background:#e8f9ee;color:var(--success)}
.pill.dp{background:#fff3d6;color:#a16a00}
.pill.belumbayar{background:#fee;color:var(--danger)}

.empty{text-align:center;padding:50px 20px;color:var(--ink2)}
.empty .ico{font-size:44px;opacity:.4;margin-bottom:10px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 16px;border-radius:8px;font-weight:700;font-size:13px;
  transition:.15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;
  box-shadow:0 4px 12px rgba(255,106,0,.25)}
.btn-primary:hover{box-shadow:0 6px 16px rgba(255,106,0,.35)}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand)}
.btn-danger{background:#fff;border:1.5px solid #fbb;color:var(--danger)}
.btn-danger:hover{background:#fee}
.btn-sm{padding:6px 10px;font-size:12px}
.btn-icon{width:30px;height:30px;padding:0;border-radius:6px;background:#f5f7fb;
  border:1px solid var(--line);color:var(--ink2);font-size:14px;line-height:1;
  display:inline-flex;align-items:center;justify-content:center;transition:.15s}
.btn-icon:hover{background:#fff;border-color:var(--brand);color:var(--brand)}

/* Modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(15,31,69,.55);
  backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:16px}
.modal.open{display:flex}
.modal-card{background:#fff;border-radius:14px;width:100%;max-width:560px;
  max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-card.wide{max-width:900px}
.modal-card.full{max-width:1000px;height:90vh;max-height:90vh}
.modal-head{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line);flex-shrink:0}
.modal-head h3{font-size:15px;font-weight:800}
.modal-head button{font-size:20px;line-height:1;color:var(--ink2);padding:4px 8px;
  border-radius:6px}
.modal-head button:hover{background:#f5f7fb}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;
  padding-top:16px;border-top:1px solid var(--line)}

/* Tabs */
.tabs-row{display:flex;gap:4px;padding:8px 16px 0;border-bottom:1px solid var(--line);
  overflow-x:auto;flex-shrink:0}
.tabs-row button{padding:10px 16px;font-weight:700;font-size:13px;color:var(--ink2);
  border-radius:8px 8px 0 0;border-bottom:2.5px solid transparent;white-space:nowrap}
.tabs-row button.active{color:var(--brand);border-bottom-color:var(--brand);
  background:#fff8f2}
.tabs-row button:hover:not(.active){background:#fafbfd;color:var(--ink)}

/* Form */
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--ink);
  margin-bottom:6px}
.field label .req{color:var(--danger)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;
  border-radius:8px;border:1.5px solid var(--line);background:#f9fafc;
  outline:none;transition:.15s;font-size:13.5px}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--brand);background:#fff;
  box-shadow:0 0 0 3px rgba(255,106,0,.1)}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11px;color:var(--ink2);margin-top:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
@media(max-width:600px){.form-row,.form-row.three{grid-template-columns:1fr}}

/* Table */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-size:11px;font-weight:800;
  color:var(--ink2);text-transform:uppercase;letter-spacing:.4px;
  border-bottom:1.5px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #f0f2f7;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr:hover td{background:#fafbfd}
.text-right{text-align:right}
.text-center{text-align:center}
.mono{font-family:ui-monospace,monospace;font-size:12px}

/* Order detail */
.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media(max-width:800px){.detail-grid{grid-template-columns:1fr}}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}
@media(max-width:500px){.info-grid{grid-template-columns:1fr}}
.info-item .k{font-size:11px;color:var(--ink2);font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.info-item .v{font-weight:600;font-size:13.5px}

.card-box{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.card-box h4{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;
  align-items:center;justify-content:space-between}

.stepper{display:flex;flex-direction:column;gap:6px}
.step-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
  background:#fafbfd;font-size:13px}
.step-item .dot{width:22px;height:22px;border-radius:50%;background:#e4e8f0;
  display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--ink3);
  flex-shrink:0}
.step-item.active{background:linear-gradient(135deg,rgba(255,106,0,.08),rgba(255,171,0,.06))}
.step-item.active .dot{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.step-item.done .dot{background:var(--success);color:#fff}
.step-item.done{color:var(--ink2)}

.hpp-box{background:#fafbfd;border:1px solid var(--line);border-radius:10px;padding:14px}
.hpp-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.hpp-row.total{border-top:1.5px dashed var(--line);margin-top:8px;padding-top:10px;
  font-weight:800;font-size:14px}

/* Toast */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);
  background:var(--ink);color:#fff;padding:12px 20px;border-radius:8px;
  font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);
  opacity:0;transition:.3s;z-index:9999;max-width:calc(100vw - 32px);text-align:center}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.success{background:var(--success)}
#toast.error{background:var(--danger)}

/* print */
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%}}
</style>
</head>
<body>

<!-- Loading -->
<div id="loading" class="loading">
  <div class="spinner"></div>
  <p style="color:var(--ink2);font-size:13px">Memuat data...</p>
</div>

<!-- Login -->
<div id="login" class="login hidden">
  <div class="login-card">
    <img src="logo.png" alt="CV Jaya Anugrah Tehnik" onerror="this.style.display='none'">
    <h1>CV Jaya Anugrah Tehnik</h1>
    <p>Sistem Manajemen Order &amp; Stok</p>
    <form id="loginForm">
      <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password">
      <button type="submit">Masuk</button>
    </form>
    <div id="loginErr" class="login-err"></div>
  </div>
</div>

<!-- App -->
<div id="app" class="hidden">
  <header class="app-header">
    <div class="brand">
      <img src="logo.png" alt="" onerror="this.style.display='none'">
      <div>
        <b>CV Jaya Anugrah Tehnik</b>
        <small>Sistem Manajemen Order</small>
      </div>
    </div>
    <button class="gear-btn" id="gearBtn" title="Pengaturan">⚙️</button>
  </header>
  <main class="app-main">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="section">
      <div class="section-head">
        <h2>Daftar Order</h2>
        <button class="btn btn-primary" id="addOrderBtn">+ Tambah Order</button>
      </div>
      <div class="toolbar">
        <input id="searchOrder" placeholder="🔍 Cari no order, pelanggan, jenis...">
        <select id="filterStatus">
          <option value="">Semua Status</option>
          <option>Order Masuk</option>
          <option>Produksi</option>
          <option>QC</option>
          <option>Selesai</option>
          <option>Diambil</option>
        </select>
      </div>
      <div class="orders-list" id="ordersList"></div>
    </div>
  </main>
</div>

<!-- Settings Modal -->
<div class="modal" id="settingsModal">
  <div class="modal-card full">
    <div class="modal-head">
      <h3>⚙️ Pengaturan &amp; Admin</h3>
      <button data-close="settingsModal">✕</button>
    </div>
    <div class="tabs-row" id="settingsTabs">
      <button data-tab="materials" class="active">📦 Material</button>
      <button data-tab="expenses">💸 Pengeluaran</button>
      <button data-tab="invoices">🧾 Invoice</button>
      <button data-tab="company">🏢 Perusahaan</button>
      <button data-tab="backup">💾 Backup</button>
    </div>
    <div class="modal-body" id="settingsBody"></div>
  </div>
</div>

<!-- Order Form Modal -->
<div class="modal" id="orderFormModal">
  <div class="modal-card wide">
    <div class="modal-head">
      <h3 id="orderFormTitle">Tambah Order</h3>
      <button data-close="orderFormModal">✕</button>
    </div>
    <div class="modal-body" id="orderFormBody"></div>
  </div>
</div>

<!-- Order Detail Modal -->
<div class="modal" id="orderDetailModal">
  <div class="modal-card wide">
    <div class="modal-head">
      <h3 id="orderDetailTitle">Detail Order</h3>
      <button data-close="orderDetailModal">✕</button>
    </div>
    <div class="modal-body" id="orderDetailBody"></div>
  </div>
</div>

<!-- Sub Modal (generic for forms) -->
<div class="modal" id="subModal">
  <div class="modal-card">
    <div class="modal-head">
      <h3 id="subModalTitle">Form</h3>
      <button data-close="subModal">✕</button>
    </div>
    <div class="modal-body" id="subModalBody"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc,
  serverTimestamp, getDoc, setDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAehuT1RmzdPa4EuCrKIF9EQmnAYLfMR4M",
  authDomain: "project-client-381ae.firebaseapp.com",
  projectId: "project-client-381ae",
  storageBucket: "project-client-381ae.firebasestorage.app",
  messagingSenderId: "804908618382",
  appId: "1:804908618382:web:37e8fde2b09fb480ea2fdf"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const C = {
  orders: 'jayaanugrahteknik_orders',
  materials: 'jayaanugrahteknik_materials',
  moves: 'jayaanugrahteknik_moves',
  invoices: 'jayaanugrahteknik_invoices',
  expenses: 'jayaanugrahteknik_expenses',
  settings: 'jayaanugrahteknik_settings'
};

const PASSWORD = 'banten01';

const state = {
  loggedIn: sessionStorage.getItem('jat_logged_in') === '1',
  orders: [], materials: [], moves: [], invoices: [], expenses: [],
  settings: {
    namaPerusahaan: 'CV Jaya Anugrah Tehnik',
    alamat: 'Jl. Bawang VI No.163, Kota Tangerang, Banten',
    telepon: '0851-3871-9054',
    email: ''
  },
  dataLoaded: { orders:false, materials:false, moves:false, invoices:false, expenses:false }
};

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtRp = n => 'Rp ' + Number(n||0).toLocaleString('id-ID');
const fmtNum = n => Number(n||0).toLocaleString('id-ID');
const fmtDate = d => {
  if (!d) return '-';
  const x = new Date(d);
  if (isNaN(x)) return '-';
  return x.toLocaleDateString('id-ID', {day:'2-digit',month:'short',year:'numeric'});
};
const today = () => new Date().toISOString().slice(0,10);
const thisYM = () => { const d=new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); };
const tsMs = t => t?.seconds ? t.seconds*1000 : (t?.toMillis ? t.toMillis() : (typeof t === 'number' ? t : 0));

function toast(msg, type='') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show ' + type;
  clearTimeout(t._t);
  t._t = setTimeout(()=> t.className = '', 3000);
}

function openModal(id) { $('#'+id).classList.add('open'); }
function closeModal(id) { $('#'+id).classList.remove('open'); }
window.closeModal = closeModal;

// close modal on background click or [data-close]
document.addEventListener('click', e => {
  if (e.target.matches('.modal') && e.target.classList.contains('open')) {
    e.target.classList.remove('open');
  }
  const closeBtn = e.target.closest('[data-close]');
  if (closeBtn) closeModal(closeBtn.dataset.close);
});

// ============= INIT =============
async function init() {
  try {
    await signInAnonymously(auth);
  } catch(e) {
    console.warn('Auth anonim gagal:', e.message);
  }

  // Load settings first
  try {
    const snap = await getDoc(doc(db, C.settings, 'main'));
    if (snap.exists()) {
      state.settings = { ...state.settings, ...snap.data() };
    }
  } catch(e) {
    console.warn('Settings load:', e.message);
  }

  // Subscribe collections
  onSnapshot(collection(db, C.orders), snap => {
    state.orders = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt));
    state.dataLoaded.orders = true;
    renderIfReady();
  }, err => console.warn('orders:', err.message));

  onSnapshot(collection(db, C.materials), snap => {
    state.materials = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => (a.nama||'').localeCompare(b.nama||''));
    state.dataLoaded.materials = true;
    renderIfReady();
  }, err => console.warn('materials:', err.message));

  onSnapshot(collection(db, C.moves), snap => {
    state.moves = snap.docs.map(d => ({id:d.id, ...d.data()}));
    state.dataLoaded.moves = true;
    renderIfReady();
  }, err => console.warn('moves:', err.message));

  onSnapshot(collection(db, C.invoices), snap => {
    state.invoices = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt));
    state.dataLoaded.invoices = true;
    renderIfReady();
  }, err => console.warn('invoices:', err.message));

  onSnapshot(collection(db, C.expenses), snap => {
    state.expenses = snap.docs.map(d => ({id:d.id, ...d.data()}))
      .sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt));
    state.dataLoaded.expenses = true;
    renderIfReady();
  }, err => console.warn('expenses:', err.message));

  // show UI after a brief delay
  setTimeout(() => {
    $('#loading').classList.add('hidden');
    if (state.loggedIn) {
      showApp();
    } else {
      $('#login').classList.remove('hidden');
    }
  }, 600);
}

function renderIfReady() {
  if (state.loggedIn) renderDashboard();
}

// ============= DASHBOARD =============
function renderDashboard() {
  if (!state.loggedIn) return;

  // stats
  const ym = thisYM();
  const ordersThisMonth = state.orders.filter(o => (o.tanggal||'').startsWith(ym));
  const activeOrders = state.orders.filter(o => !['Selesai','Diambil'].includes(o.status));
  const revenueThisMonth = state.orders
    .filter(o => (o.tanggal||'').startsWith(ym) && ['Selesai','Diambil'].includes(o.status))
    .reduce((s,o) => s + (+o.nilaiOrder||0), 0);
  const lowStock = state.materials.filter(m => (+m.stok||0) <= (+m.stokMin||0));

  $('#statsGrid').innerHTML = `
    <div class="stat">
      <div class="label">Order Aktif</div>
      <div class="value">${activeOrders.length}</div>
      <div class="sub">${ordersThisMonth.length} masuk bulan ini</div>
    </div>
    <div class="stat teal">
      <div class="label">Pendapatan Bulan Ini</div>
      <div class="value">${fmtRp(revenueThisMonth)}</div>
      <div class="sub">Order selesai</div>
    </div>
    <div class="stat ${lowStock.length?'danger':'warning'}">
      <div class="label">Stok Kritis</div>
      <div class="value">${lowStock.length}</div>
      <div class="sub">dari ${state.materials.length} material</div>
    </div>
    <div class="stat">
      <div class="label">Total Order</div>
      <div class="value">${state.orders.length}</div>
      <div class="sub">Semua waktu</div>
    </div>
  `;

  // orders list
  const search = $('#searchOrder')?.value?.toLowerCase() || '';
  const filter = $('#filterStatus')?.value || '';
  let list = state.orders;
  if (filter) list = list.filter(o => o.status === filter);
  if (search) {
    list = list.filter(o => 
      (o.noOrder||'').toLowerCase().includes(search) ||
      (o.pelanggan||'').toLowerCase().includes(search) ||
      (o.jenis||'').toLowerCase().includes(search) ||
      (o.pekerjaan||'').toLowerCase().includes(search)
    );
  }

  const box = $('#ordersList');
  if (!list.length) {
    box.innerHTML = `<div class="empty"><div class="ico">📋</div>
      <p>${state.orders.length? 'Tidak ada order yang cocok.' : 'Belum ada order. Klik <b>+ Tambah Order</b> untuk mulai.'}</p></div>`;
    return;
  }

  box.innerHTML = list.map(o => `
    <div class="order-card" data-order="${o.id}">
      <div class="order-no">${esc(o.noOrder||'-')}</div>
      <div class="order-pelanggan">
        <b>${esc(o.pelanggan||'-')}</b>
        <small>${fmtDate(o.tanggal)}</small>
      </div>
      <div class="order-jenis">${esc(o.jenis||'-')}</div>
      <div class="order-status">${statusPill(o.status)}</div>
      <div class="order-nilai">${fmtRp(o.nilaiOrder)}</div>
    </div>
  `).join('');

  $$('#ordersList .order-card').forEach(el => {
    el.addEventListener('click', () => openOrderDetail(el.dataset.order));
  });
}

  const m = { 'Order Masuk':'baru', 'Produksi':'produksi', 'QC':'qc',

  return `<span class="pill ${m[s]||'baru'}">${esc(s||'Order Masuk')}</span>`;

function genOrderNo() {
  const d = new Date();
  const ym = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0');
  const prefix = 'SPK-' + ym + '-';
  const existing = state.orders.filter(o => (o.noOrder||'').startsWith(prefix));
  const maxN = existing.reduce((m,o) => {
    const n = parseInt((o.noOrder||'').split('-')[2], 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + String(maxN + 1).padStart(4, '0');
}

  const matCost = moves.reduce((s,m) => s + (+m.harga||0) * (+m.jumlah||0), 0);
  const hpp = (+o.biayaJasa||0) + matCost;
  const margin = (+o.nilaiOrder||0) - hpp;
  const invoice = state.invoices.find(inv => inv.orderId === id);
  const steps = ['Order Masuk','Produksi','QC','Selesai','Diambil'];
  const cur = steps.indexOf(o.status);

  $('#orderDetailTitle').textContent = 'Detail Order — ' + o.noOrder;
  $('#orderDetailBody').innerHTML = `

            <thead><tr><th>Material</th><th class="text-right">Qty</th>
            <th class="text-right">Harga</th><th class="text-right">Subtotal</th><th></th></tr></thead>
            <tbody>${moves.map(m=>`

                <td class="text-right">${fmtNum(m.jumlah)} ${esc(m.satuan||'')}</td>
                <td class="text-right mono">${fmtRp(m.harga)}</td>
                <td class="text-right mono">${fmtRp((+m.harga||0)*(+m.jumlah||0))}</td>
                <td class="text-right"><button class="btn-icon" data-del-move="${m.id}">×</button></td>
              </tr>

          </table></div>` : `<p style="font-size:12.5px;color:var(--ink2);text-align:center;padding:16px 0">Belum ada pemakaian material.</p>`}

        <div class="card-box">

      </div>

  $('#editOrderBtn').onclick = () => { closeModal('orderDetailModal'); openOrderForm(o); };

    if (!confirm('Hapus order ' + o.noOrder + '?')) return;
    try {
      await deleteDoc(doc(db, C.orders, o.id));
      // also delete related moves
      for (const m of moves) await deleteDoc(doc(db, C.moves, m.id));
      toast('Order dihapus.', 'success');
      closeModal('orderDetailModal');
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  };
  $$('[data-advance]').forEach(b => b.onclick = async () => {
    try {
      await updateDoc(doc(db, C.orders, o.id), { status: b.dataset.advance });
      toast('Status diubah ke ' + b.dataset.advance, 'success');
      openOrderDetail(o.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
  const usageBtn = $('#addUsageBtn');
  if (usageBtn) usageBtn.onclick = () => openUsageForm(o);
  $$('[data-del-move]').forEach(b => b.onclick = async () => {
    if (!confirm('Hapus pemakaian ini? Stok akan dikembalikan.')) return;
    const mv = state.moves.find(x => x.id === b.dataset.delMove);
    if (!mv) return;
    try {
      await deleteDoc(doc(db, C.moves, mv.id));
      // restore stock
      const mat = state.materials.find(m => m.id === mv.materialId);
      if (mat) {
        await updateDoc(doc(db, C.materials, mat.id), { stok: (+mat.stok||0) + (+mv.jumlah||0) });
      }
      toast('Pemakaian dihapus.', 'success');
      openOrderDetail(o.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
  const invBtn = $('#createInvoiceBtn');
  if (invBtn) invBtn.onclick = () => openInvoiceForm(o);
  const openInvBtn = $('#openInvoiceBtn');
  if (openInvBtn) openInvBtn.onclick = () => openInvoiceDetail(invoice.id);
}

function payPill(s) {
  const m = { 'Belum Bayar':'belumbayar', 'DP':'dp', 'Lunas':'lunas' };
  return `<span class="pill ${m[s]||'belumbayar'}">${esc(s||'Belum Bayar')}</span>`;

function openUsageForm(order) {
  if (!state.materials.length) {
    toast('Belum ada material. Tambah di menu Pengaturan ⚙️ → Material.', 'error');
    return;
  }
  const opts = state.materials.map(m => 
    `<option value="${m.id}">${esc(m.nama)} (stok: ${fmtNum(m.stok)} ${esc(m.satuan)})</option>`
  ).join('');
  $('#subModalTitle').textContent = 'Tambah Pemakaian Material';
  $('#subModalBody').innerHTML = `
    <form id="usageForm">
      <div class="field">
        <label>Material <span class="req">*</span></label>
        <select name="materialId" required>${opts}</select>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Jumlah <span class="req">*</span></label>
          <input type="number" name="jumlah" required min="0.01" step="any" value="1">
        </div>
        <div class="field">
          <label>Keterangan</label>
          <input name="ket" placeholder="Opsional">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#usageForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const mat = state.materials.find(m => m.id === fd.get('materialId'));
    const qty = +fd.get('jumlah');
    if (!mat || !qty) return;
    if (qty > (+mat.stok||0)) { toast('Stok tidak cukup (tersedia '+fmtNum(mat.stok)+').', 'error'); return; }
    try {
      await addDoc(collection(db, C.moves), {
        materialId: mat.id, materialNama: mat.nama, satuan: mat.satuan,
        tipe: 'keluar', jumlah: qty, harga: mat.harga,
        keterangan: fd.get('ket').trim() || 'Pemakaian order ' + order.noOrder,
        orderId: order.id, tanggal: today(), createdAt: serverTimestamp()
      });
      await updateDoc(doc(db, C.materials, mat.id), { stok: (+mat.stok||0) - qty });
      toast('Pemakaian dicatat.', 'success');
      closeModal('subModal');
      openOrderDetail(order.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
}

function genInvoiceNo() {
  const d = new Date();
  const ym = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0');
  const prefix = 'INV-' + ym + '-';
  const existing = state.invoices.filter(i => (i.noInvoice||'').startsWith(prefix));
  const maxN = existing.reduce((m,i) => {
    const n = parseInt((i.noInvoice||'').split('-')[2], 10);
    return isNaN(n) ? m : Math.max(m, n);
  }, 0);
  return prefix + String(maxN + 1).padStart(4, '0');
}

      <div style="background:#fafbfd;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px">
        Pelanggan: <b>${esc(order.pelanggan)}</b><br>
        Nilai order: <b>${fmtRp(order.nilaiOrder)}</b>
      </div>
      <div class="form-row">
        <div class="field">
          <label>No. Invoice</label>
          <input name="noInvoice" value="${genInvoiceNo()}" readonly style="background:#f0f2f7">
        </div>
        <div class="field">
          <label>Tanggal</label>
          <input type="date" name="tanggal" value="${today()}" required>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Total (Rp)</label>
          <input type="number" name="total" value="${order.nilaiOrder||0}" min="0" required>
        </div>
        <div class="field">
          <label>PPN (%)</label>
          <input type="number" name="ppn" value="0" min="0" max="100" step="any">
        </div>
      </div>
      <div class="field">
        <label>Catatan</label>
        <textarea name="catatan" placeholder="Opsional"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">Buat Invoice</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#invForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const ppn = +fd.get('ppn')||0;
    const total = +fd.get('total')||0;
    const finalTotal = total + (total * ppn / 100);
    try {
      await addDoc(collection(db, C.invoices), {
        noInvoice: fd.get('noInvoice'),
        orderId: order.id,
        tanggal: fd.get('tanggal'),
        total: finalTotal,
        ppn,
        catatan: fd.get('catatan').trim(),
        status: 'Belum Bayar',
        pembayaran: [],
        createdAt: serverTimestamp()
      });
      toast('Invoice dibuat.', 'success');
      closeModal('subModal');
      openOrderDetail(order.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
}

function openInvoiceDetail(invoiceId) {
  const inv = state.invoices.find(i => i.id === invoiceId);
  if (!inv) return;
  const o = state.orders.find(x => x.id === inv.orderId) || {};
  const paid = (inv.pembayaran||[]).reduce((s,p) => s + (+p.jumlah||0), 0);
  const remaining = (+inv.total||0) - paid;

  $('#orderDetailTitle').textContent = 'Invoice — ' + inv.noInvoice;
  $('#orderDetailBody').innerHTML = `
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-bottom:12px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" id="backToOrder">← Kembali ke Order</button>
      <button class="btn btn-ghost btn-sm" id="printInv">🖨 Print Invoice</button>
    </div>
    <div class="card-box">
      <h4>Detail Invoice</h4>
      <div class="info-grid">
        <div class="info-item"><div class="k">No. Invoice</div><div class="v mono">${esc(inv.noInvoice)}</div></div>
        <div class="info-item"><div class="k">Pelanggan</div><div class="v">${esc(o.pelanggan||'-')}</div></div>
        <div class="info-item"><div class="k">No. Order</div><div class="v mono">${esc(o.noOrder||'-')}</div></div>
        <div class="info-item"><div class="k">Jenis</div><div class="v">${esc(o.jenis||'-')}</div></div>
        <div class="info-item"><div class="k">Tanggal</div><div class="v">${fmtDate(inv.tanggal)}</div></div>
        <div class="info-item"><div class="k">Status</div><div class="v">${payPill(inv.status)}</div></div>
        <div class="info-item"><div class="k">Total</div><div class="v">${fmtRp(inv.total)}</div></div>
        <div class="info-item"><div class="k">Sudah Dibayar</div><div class="v" style="color:var(--success)">${fmtRp(paid)}</div></div>
        <div class="info-item"><div class="k">Sisa</div>
          <div class="v" style="color:${remaining>0?'var(--danger)':'var(--success)'}">${fmtRp(remaining)}</div></div>
      </div>
    </div>
    <div class="card-box">
      <h4>Riwayat Pembayaran
        ${remaining>0?`<button class="btn btn-primary btn-sm" id="addPayBtn">+ Bayar</button>`:''}</h4>
      ${(inv.pembayaran||[]).length ? `<table>
        <thead><tr><th>Tanggal</th><th>Metode</th><th class="text-right">Jumlah</th></tr></thead>
        <tbody>${inv.pembayaran.map(p => `
          <tr><td>${fmtDate(p.tanggal)}</td><td>${esc(p.metode)||'-'}</td>
          <td class="text-right mono">${fmtRp(p.jumlah)}</td></tr>
        `).join('')}</tbody>
      </table>` : `<p style="font-size:12.5px;color:var(--ink2);text-align:center;padding:16px 0">Belum ada pembayaran.</p>`}
    </div>
    <div class="card-box">
      <h4>Ubah Status</h4>
      <select id="invStatusSelect" style="width:100%;padding:10px 12px;border-radius:8px;
        border:1.5px solid var(--line);background:#fff;outline:none;font-size:13.5px">
        ${['Belum Bayar','DP','Lunas'].map(s => `<option ${s===inv.status?'selected':''}>${s}</option>`).join('')}
      </select>
    </div>
  `;
  openModal('orderDetailModal');

  $('#backToOrder').onclick = () => openOrderDetail(o.id);
  $('#printInv').onclick = () => printInvoice(inv, o);
  const addPayBtn = $('#addPayBtn');
  if (addPayBtn) addPayBtn.onclick = () => openPaymentForm(inv, remaining);
  $('#invStatusSelect').onchange = async e => {
    try {
      await updateDoc(doc(db, C.invoices, inv.id), { status: e.target.value });
      toast('Status invoice diperbarui.', 'success');
      openInvoiceDetail(inv.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  };
}

function openPaymentForm(inv, remaining) {
  $('#subModalTitle').textContent = 'Tambah Pembayaran';
  $('#subModalBody').innerHTML = `
    <form id="payForm">
      <div style="background:#fafbfd;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px">
        Total: <b>${fmtRp(inv.total)}</b><br>
        Sisa: <b style="color:var(--danger)">${fmtRp(remaining)}</b>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Tanggal</label>
          <input type="date" name="tanggal" value="${today()}" required>
        </div>
        <div class="field">
          <label>Metode</label>
          <select name="metode">
            <option>Transfer</option><option>Tunai</option><option>Cek</option><option>Lainnya</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Jumlah (Rp) <span class="req">*</span></label>
        <input type="number" name="jumlah" min="0.01" step="any" value="${remaining}" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#payForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const jumlah = +fd.get('jumlah');
    if (!jumlah) return;
    const pembayaran = [...(inv.pembayaran||[]), {
      tanggal: fd.get('tanggal'), metode: fd.get('metode'), jumlah
    }];
    const totalPaid = pembayaran.reduce((s,p) => s + (+p.jumlah||0), 0);
    const status = totalPaid >= inv.total ? 'Lunas' : (totalPaid > 0 ? 'DP' : 'Belum Bayar');
    try {
      await updateDoc(doc(db, C.invoices, inv.id), { pembayaran, status });
      toast('Pembayaran dicatat.', 'success');
      closeModal('subModal');
      openInvoiceDetail(inv.id);
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
}

let settingsTab = 'materials';

$('#gearBtn').addEventListener('click', () => {
  openModal('settingsModal');
  renderSettingsTab(settingsTab);
});

$('#settingsTabs').addEventListener('click', e => {
  const btn = e.target.closest('button[data-tab]');
  if (!btn) return;
  settingsTab = btn.dataset.tab;
  $$('#settingsTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === settingsTab));

});

function renderSettingsTab(tab) {
  const box = $('#settingsBody');
  if (tab === 'materials') {
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <div>
          <h3 style="font-size:15px;font-weight:800">Stok Material</h3>
          <p style="font-size:12.5px;color:var(--ink2);margin-top:2px">${state.materials.length} material terdaftar</p>
        </div>
        <button class="btn btn-primary" id="addMatBtn">+ Tambah Material</button>
      </div>
      ${state.materials.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Nama</th><th>Satuan</th><th class="text-right">Stok</th>
        <th class="text-right">Min</th><th class="text-right">Harga</th><th>Status</th><th></th></tr></thead>
        <tbody>${state.materials.map(m => {
          const low = (+m.stok||0) <= (+m.stokMin||0);
          return `<tr>
            <td><b>${esc(m.nama)}</b>${m.supplier?`<br><small style="color:var(--ink2)">${esc(m.supplier)}</small>`:''}</td>
            <td>${esc(m.satuan)}</td>
            <td class="text-right"><b>${fmtNum(m.stok)}</b></td>
            <td class="text-right">${fmtNum(m.stokMin)}</td>
            <td class="text-right mono">${fmtRp(m.harga)}</td>
            <td>${low?'<span class="pill kritis">Kritis</span>':'<span class="pill ok">Aman</span>'}</td>
            <td class="text-right">
              <div style="display:flex;gap:4px;justify-content:flex-end;flex-wrap:wrap">
                <button class="btn-icon" data-in="${m.id}" title="Stok Masuk">+</button>
                <button class="btn-icon" data-out="${m.id}" title="Stok Keluar">−</button>
                <button class="btn-icon" data-hist="${m.id}" title="Riwayat">📋</button>
                <button class="btn-icon" data-edit="${m.id}" title="Edit">✏</button>
                <button class="btn-icon" data-del="${m.id}" title="Hapus">🗑</button>
              </div>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="ico">📦</div>
        <p>Belum ada material. Klik <b>+ Tambah Material</b> untuk mulai.</p></div>`}
    `;
    $('#addMatBtn').onclick = () => openMatForm();
    $$('[data-edit]', box).forEach(b => b.onclick = () => openMatForm(state.materials.find(m=>m.id===b.dataset.edit)));
    $$('[data-del]', box).forEach(b => b.onclick = async () => {
      const m = state.materials.find(x=>x.id===b.dataset.del);
      if (!m || !confirm('Hapus material "'+m.nama+'"?')) return;
      try { await deleteDoc(doc(db, C.materials, m.id)); toast('Dihapus.', 'success'); renderSettingsTab('materials'); }
      catch(err) { toast('Gagal: ' + err.message, 'error'); }
    });
    $$('[data-in]', box).forEach(b => b.onclick = () => openMoveForm(b.dataset.in, 'masuk'));
    $$('[data-out]', box).forEach(b => b.onclick = () => openMoveForm(b.dataset.out, 'keluar'));
    $$('[data-hist]', box).forEach(b => b.onclick = () => showHistory(b.dataset.hist));
  }
  else if (tab === 'expenses') {
    box.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">
        <h3 style="font-size:15px;font-weight:800">Pengeluaran</h3>
        <button class="btn btn-primary" id="addExpBtn">+ Tambah</button>
      </div>
      ${state.expenses.length ? `<div class="table-wrap"><table>
        <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th>
        <th class="text-right">Jumlah</th><th></th></tr></thead>
        <tbody>${state.expenses.map(x=>`
          <tr><td>${fmtDate(x.tanggal)}</td><td><b>${esc(x.kategori)}</b></td>
          <td>${esc(x.keterangan)}</td>
          <td class="text-right mono">${fmtRp(x.jumlah)}</td>
          <td class="text-right"><button class="btn-icon" data-exp-del="${x.id}">🗑</button></td></tr>
        `).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="ico">💸</div><p>Belum ada pengeluaran.</p></div>`}
    `;
    $('#addExpBtn').onclick = openExpenseForm;
    $$('[data-exp-del]', box).forEach(b => b.onclick = async () => {
      if (!confirm('Hapus pengeluaran ini?')) return;
      try { await deleteDoc(doc(db, C.expenses, b.dataset.expDel)); toast('Dihapus.', 'success'); renderSettingsTab('expenses'); }
      catch(err) { toast('Gagal: ' + err.message, 'error'); }
    });
  }
  else if (tab === 'invoices') {
    box.innerHTML = `
      <h3 style="font-size:15px;font-weight:800;margin-bottom:16px">Semua Invoice</h3>
      ${state.invoices.length ? `<div class="table-wrap"><table>
        <thead><tr><th>No.</th><th>Tanggal</th><th>Pelanggan</th>
        <th class="text-right">Total</th><th>Status</th><th></th></tr></thead>
        <tbody>${state.invoices.map(inv=>{
          const o = state.orders.find(x=>x.id===inv.orderId)||{};
          return `<tr>
            <td class="mono">${esc(inv.noInvoice)}</td>
            <td>${fmtDate(inv.tanggal)}</td>
            <td>${esc(o.pelanggan||'-')}</td>
            <td class="text-right mono">${fmtRp(inv.total)}</td>
            <td>${payPill(inv.status)}</td>
            <td class="text-right"><button class="btn-icon" data-inv-open="${inv.id}">→</button></td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>` : `<div class="empty"><div class="ico">🧾</div><p>Belum ada invoice. Buat dari detail order yang sudah selesai.</p></div>`}
    `;
    $$('[data-inv-open]', box).forEach(b => b.onclick = () => {
      closeModal('settingsModal');
      openInvoiceDetail(b.dataset.invOpen);
    });
  }
  else if (tab === 'company') {
    const s = state.settings;
    box.innerHTML = `
      <h3 style="font-size:15px;font-weight:800;margin-bottom:16px">Informasi Perusahaan</h3>
      <form id="companyForm" style="max-width:560px">
        <div class="field">
          <label>Nama Perusahaan</label>
          <input name="namaPerusahaan" value="${esc(s.namaPerusahaan)}">
        </div>
        <div class="field">
          <label>Alamat</label>
          <textarea name="alamat">${esc(s.alamat)}</textarea>
        </div>
        <div class="form-row">
          <div class="field">
            <label>Telepon</label>
            <input name="telepon" value="${esc(s.telepon)}">
          </div>
          <div class="field">
            <label>Email</label>
            <input type="email" name="email" value="${esc(s.email||'')}">
          </div>
        </div>
        <button class="btn btn-primary" type="submit">Simpan</button>
      </form>
    `;
    $('#companyForm').onsubmit = async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const data = {
        namaPerusahaan: fd.get('namaPerusahaan').trim(),
        alamat: fd.get('alamat').trim(),
        telepon: fd.get('telepon').trim(),
        email: fd.get('email').trim()
      };
      try {
        await setDoc(doc(db, C.settings, 'main'), data, { merge: true });
        state.settings = { ...state.settings, ...data };
        toast('Pengaturan disimpan.', 'success');
      } catch(err) { toast('Gagal: ' + err.message, 'error'); }
    };
  }
  else if (tab === 'backup') {
    box.innerHTML = `
      <h3 style="font-size:15px;font-weight:800;margin-bottom:8px">Backup &amp; Restore</h3>
      <p style="font-size:13px;color:var(--ink2);margin-bottom:16px">
        Data tersimpan di Firebase Firestore (cloud). Backup ini untuk arsip lokal.
      </p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn btn-primary" id="exportBtn">⬇ Download Backup (JSON)</button>
      </div>
      <hr style="border:0;border-top:1px solid var(--line);margin:20px 0">
      <h4 style="font-size:13px;font-weight:800;margin-bottom:8px">Info Sistem</h4>
      <div style="font-size:12.5px;color:var(--ink2);line-height:1.8">
        <div>📦 Orders: ${state.orders.length}</div>
        <div>📊 Materials: ${state.materials.length}</div>
        <div>💸 Expenses: ${state.expenses.length}</div>
        <div>🧾 Invoices: ${state.invoices.length}</div>
        <div>📋 Moves: ${state.moves.length}</div>
        <div style="margin-top:8px">🔥 Firebase Project: <b>${esc(firebaseConfig.projectId)}</b></div>
      </div>
    `;
    $('#exportBtn').onclick = () => {
      const backup = {
        exportedAt: new Date().toISOString(),
        settings: state.settings,
        orders: state.orders,
        materials: state.materials,
        moves: state.moves,
        invoices: state.invoices,
        expenses: state.expenses
      };
      const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'backup-jat-'+today()+'.json'; a.click();
      URL.revokeObjectURL(url);
      toast('Backup diunduh.', 'success');
    };
  }
}

  $('#subModalTitle').textContent = edit ? 'Edit Material' : 'Tambah Material';
  $('#subModalBody').innerHTML = `
    <form id="matForm">
      <div class="field">
        <label>Nama Material <span class="req">*</span></label>
        <input name="nama" required value="${esc(m.nama)}" placeholder="Contoh: Besi Plat 5mm">
      </div>
      <div class="form-row three">
        <div class="field">
          <label>Satuan <span class="req">*</span></label>
          <select name="satuan">${SATUAN.map(s=>`<option ${s===m.satuan?'selected':''}>${s}</option>`).join('')}</select>
        </div>
        <div class="field">
          <label>Harga Satuan (Rp) <span class="req">*</span></label>
          <input type="number" name="harga" required min="0" value="${esc(m.harga)}">
        </div>
        <div class="field">
          <label>Stok Awal</label>

          <div class="hint">${edit?'Ubah via tombol + / −':'Hanya untuk tambah baru'}</div>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Stok Minimum</label>
          <input type="number" name="stokMin" min="0" step="any" value="${esc(m.stokMin)}">
          <div class="hint">Notifikasi jika stok ≤ nilai ini</div>
        </div>
        <div class="field">
          <label>Supplier</label>
          <input name="supplier" value="${esc(m.supplier||'')}" placeholder="Nama supplier">
        </div>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">${edit?'Simpan':'Tambah'}</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#matForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const data = {
      nama: fd.get('nama').trim(),
      satuan: fd.get('satuan'),
      harga: +fd.get('harga')||0,
      stokMin: +fd.get('stokMin')||0,
      supplier: fd.get('supplier').trim()
    };
    if (edit) {
      try {
        await updateDoc(doc(db, C.materials, edit.id), data);
        toast('Material diperbarui.', 'success');
        closeModal('subModal');
        renderSettingsTab('materials');
      } catch(err) { toast('Gagal: ' + err.message, 'error'); }
    } else {
      data.stok = +fd.get('stok')||0;
      data.createdAt = serverTimestamp();
      try {
        await addDoc(collection(db, C.materials), data);
        toast('Material ditambahkan.', 'success');
        closeModal('subModal');
        renderSettingsTab('materials');
      } catch(err) { toast('Gagal: ' + err.message, 'error'); }
    }
  });
}

function openMoveForm(materialId, tipe) {
  const m = state.materials.find(x=>x.id===materialId);
  if (!m) return;
  $('#subModalTitle').textContent = (tipe==='masuk'?'Stok Masuk':'Stok Keluar')+' — '+m.nama;
  $('#subModalBody').innerHTML = `
    <form id="moveForm">
      <div style="background:#fafbfd;padding:12px;border-radius:8px;margin-bottom:14px;font-size:13px">
        <b>${esc(m.nama)}</b> — stok saat ini: <b>${fmtNum(m.stok)} ${esc(m.satuan)}</b>
      </div>
      <div class="form-row">
        <div class="field">
          <label>Jumlah <span class="req">*</span></label>
          <input type="number" name="jumlah" required min="0.01" step="any" value="1">
        </div>
        <div class="field">
          <label>Tanggal</label>
          <input type="date" name="tanggal" value="${today()}">
        </div>
      </div>
      <div class="field">
        <label>Keterangan</label>
        <input name="ket" placeholder="${tipe==='masuk'?'Pembelian / supplier':'Pemakaian / rusak'}">
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#moveForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const qty = +fd.get('jumlah');
    if (!qty) return;
    if (tipe === 'keluar' && qty > (+m.stok||0)) { toast('Stok tidak cukup.', 'error'); return; }
    try {
      await addDoc(collection(db, C.moves), {
        materialId: m.id, materialNama: m.nama, satuan: m.satuan,
        tipe, jumlah: qty, harga: m.harga,
        keterangan: fd.get('ket').trim(),
        orderId: null, tanggal: fd.get('tanggal'), createdAt: serverTimestamp()
      });
      const newStok = tipe === 'masuk' ? (+m.stok||0) + qty : (+m.stok||0) - qty;
      await updateDoc(doc(db, C.materials, m.id), { stok: newStok });
      toast('Stok diperbarui.', 'success');
      closeModal('subModal');
      renderSettingsTab('materials');
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
}

function showHistory(materialId) {
  const m = state.materials.find(x=>x.id===materialId);
  const list = state.moves.filter(x=>x.materialId===materialId)
    .sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt));
  $('#subModalTitle').textContent = 'Riwayat — ' + m.nama;
  $('#subModalBody').innerHTML = `
    ${list.length ? `<div class="table-wrap"><table>
      <thead><tr><th>Tanggal</th><th>Tipe</th><th class="text-right">Jumlah</th>
      <th>Keterangan</th></tr></thead>
      <tbody>${list.map(x=>`
        <tr>
          <td>${fmtDate(x.tanggal)}</td>
          <td><span class="pill ${x.tipe==='masuk'?'selesai':'produksi'}">${x.tipe}</span></td>
          <td class="text-right"><b>${x.tipe==='masuk'?'+':'−'}${fmtNum(x.jumlah)}</b> ${esc(x.satuan||'')}</td>
          <td>${esc(x.keterangan)||'-'}</td>
        </tr>
      `).join('')}</tbody>
    </table></div>` : `<div class="empty"><p>Belum ada riwayat.</p></div>`}
    <div class="modal-actions"><button class="btn btn-ghost" data-close="subModal">Tutup</button></div>
  `;
  openModal('subModal');
}

// ============= EXPENSE FORM =============
function openExpenseForm() {
  $('#subModalTitle').textContent = 'Tambah Pengeluaran';
  $('#subModalBody').innerHTML = `
    <form id="expForm">
      <div class="form-row">
        <div class="field">
          <label>Tanggal <span class="req">*</span></label>
          <input type="date" name="tanggal" value="${today()}" required>
        </div>
        <div class="field">
          <label>Kategori <span class="req">*</span></label>
          <select name="kategori">
            <option>Beli Material</option><option>Operasional</option>
            <option>Listrik &amp; Air</option><option>Gaji</option>
            <option>Transport</option><option>Maintenance</option><option>Lainnya</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Keterangan <span class="req">*</span></label>
        <input name="keterangan" required placeholder="Contoh: Beli oli mesin bubut">
      </div>
      <div class="field">
        <label>Jumlah (Rp) <span class="req">*</span></label>
        <input type="number" name="jumlah" min="0" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-close="subModal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  `;
  openModal('subModal');
  $('#expForm').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    try {
      await addDoc(collection(db, C.expenses), {
        tanggal: fd.get('tanggal'),
        kategori: fd.get('kategori'),
        keterangan: fd.get('keterangan').trim(),
        jumlah: +fd.get('jumlah')||0,
        createdAt: serverTimestamp()
      });
      toast('Pengeluaran ditambahkan.', 'success');
      closeModal('subModal');
      renderSettingsTab('expenses');
    } catch(err) { toast('Gagal: ' + err.message, 'error'); }
  });
}
